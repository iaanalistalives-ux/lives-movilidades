<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Entregas — LIVES</title>
<style>
  :root{
    --petroleo:#0E3B36; --esmeralda:#10B981; --alerta:#DC2626;
    --monetario:#F59E0B; --fondo:#F1F6F4; --gris:#6B7280; --borde:#D1D5DB;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Arial,sans-serif;}
  body{background:var(--fondo); min-height:100vh; padding-bottom:24px;}
  header{background:var(--petroleo); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;}
  header h1{font-size:17px; font-weight:600;}
  header .marca{font-size:20px; font-weight:300; letter-spacing:6px;}
  .contenedor{max-width:560px; margin:18px auto; padding:0 14px;}

  .selector{background:#fff; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(14,59,54,.08); margin-bottom:16px;}
  .selector label{display:block; font-size:13px; font-weight:600; color:var(--petroleo); margin-bottom:8px;}
  .selector select{width:100%; padding:12px; border:1px solid var(--borde); border-radius:8px; font-size:16px;}
  .selector .refrescar{margin-top:10px; width:100%; padding:10px; background:var(--esmeralda); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}

  .resumen{font-size:13px; color:var(--gris); margin:0 4px 12px;}
  .resumen b{color:var(--petroleo);}

  .jornada{background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(14,59,54,.08); margin-bottom:16px; display:none;}
  .jornada.visible{display:block;}
  .jornada .titulo{font-size:13px; font-weight:700; color:var(--petroleo); margin-bottom:10px;}
  .jornada .elegir{display:flex; gap:8px;}
  .jornada .elegir button{flex:1; padding:12px 8px; border:1.5px solid var(--borde); border-radius:8px; background:#fff; font-size:13px; font-weight:700; color:var(--petroleo); cursor:pointer;}
  .jornada .elegir button:active{background:var(--fondo);}
  .jornada .btn-otro-punto{width:100%; margin-top:8px; padding:11px 8px; border:1.5px dashed var(--esmeralda); border-radius:8px; background:#fff; font-size:12.5px; font-weight:700; color:var(--petroleo); cursor:pointer;}
  .jornada .btn-otro-punto:active{background:var(--fondo);}
  .jornada .confirmado{display:flex; align-items:center; gap:8px; background:#ECFDF5; border:1px solid #A7F3D0; border-radius:8px; padding:10px 12px; font-size:13px; color:#065F46; font-weight:600;}
  .jornada .confirmado .icono{font-size:16px;}
  .jornada .btn-deshacer{width:100%; margin-top:10px; padding:9px 8px; border:none; background:transparent; color:var(--gris); font-size:12px; text-decoration:underline; cursor:pointer;}
  .jornada .btn-deshacer:active{color:var(--alerta);}

  .modal-confirma-jornada{position:fixed; inset:0; background:rgba(14,59,54,.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-confirma-jornada.visible{display:flex;}
  .modal-confirma-jornada .caja{background:#fff; border-radius:16px; padding:30px 24px; text-align:center; max-width:340px; width:100%; box-shadow:0 12px 34px rgba(0,0,0,.32);}
  .modal-confirma-jornada .icono{font-size:48px; margin-bottom:10px;}
  .modal-confirma-jornada .titulo{font-size:18px; font-weight:800; color:var(--petroleo); margin-bottom:8px;}
  .modal-confirma-jornada .detalle{font-size:14px; color:var(--gris); margin-bottom:20px; line-height:1.4;}
  .modal-confirma-jornada .btn-entendido{width:100%; padding:14px; background:var(--esmeralda); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;}

  .card{background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(14,59,54,.08); margin-bottom:14px; border-left:5px solid var(--esmeralda);}
  .card.urgente{border-left-color:var(--alerta);}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .card .id{font-weight:800; color:var(--petroleo); font-size:15px;}
  .card .badge-urg{background:var(--alerta); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px;}
  .card .badge-zona{background:var(--petroleo); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px;}
  .card .badge-serv{font-size:11px; font-weight:800; padding:3px 9px; border-radius:12px;}
  .card .badge-serv.envio{background:var(--petroleo); color:#fff;}
  .card .badge-serv.recojo{background:var(--monetario); color:#fff;}
  .card .badge-serv.traslado{background:#6D28D9; color:#fff;}
  .card .accion-linea.traslado{color:#6D28D9;}
  .card .accion-linea{font-size:12px; font-weight:800; letter-spacing:.5px; margin-bottom:2px;}
  .card .accion-linea.envio{color:var(--esmeralda);}
  .card .accion-linea.recojo{color:var(--monetario);}
  .card.en-espera{border-left-color:var(--monetario); background:#FFFBEB;}
  .badge-espera{background:#FEF3C7; color:#92400E; font-size:12px; font-weight:700; padding:8px 10px; border-radius:8px; text-align:center; margin-bottom:10px;}
  .btn-llegue{width:100%; padding:13px; background:var(--monetario); color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-llegue:disabled{background:var(--gris); cursor:not-allowed;}
  .card .destino{font-size:18px; font-weight:700; color:#111; margin-bottom:2px;}
  .card .distrito{font-size:13px; color:var(--gris); margin-bottom:10px;}
  .card .datos{font-size:13px; color:#374151; line-height:1.7; margin-bottom:12px;}
  .card .datos b{color:var(--petroleo);}
  .card .coment{background:#F9FAFB; border-radius:7px; padding:8px 10px; font-size:12px; color:var(--gris); margin-bottom:12px;}

  .acciones{display:flex; gap:10px;}
  .btn-entregado{flex:1; padding:13px; background:var(--esmeralda); color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-noentregado{flex:1; padding:13px; background:#fff; color:var(--alerta); border:1.5px solid var(--alerta); border-radius:9px; font-size:15px; font-weight:700; cursor:pointer;}

  .zona-gps{margin-top:10px;}
  .gps-esperando{display:flex; align-items:center; gap:10px; padding:12px 14px; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:9px; font-size:13.5px; color:#1E40AF; font-weight:600;}
  .gps-esperando .spinner{width:16px; height:16px; border:2.5px solid #BFDBFE; border-top-color:#1E40AF; border-radius:50%; animation:girar .8s linear infinite; flex:none;}
  @keyframes girar{ to{ transform:rotate(360deg); } }
  .gps-bloqueo{padding:13px 14px; background:#FFFBEB; border:1px solid #FDE68A; border-radius:9px;}
  .gps-bloqueo .gps-msg{font-size:13.5px; color:#92400E; font-weight:600; line-height:1.4; margin-bottom:10px;}
  .gps-bloqueo .gps-botones{display:flex; flex-direction:column; gap:8px;}
  .btn-gps-reintentar{padding:12px; background:var(--monetario); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-gps-continuar{padding:9px; background:transparent; color:#92400E; border:none; font-size:12px; text-decoration:underline; cursor:pointer;}
  .btn-foto{width:100%; margin-top:10px; padding:11px; background:#fff; color:var(--petroleo); border:1.5px dashed var(--borde); border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-foto.con-foto{border-style:solid; border-color:var(--esmeralda); color:var(--esmeralda); background:#ECFDF5;}
  .foto-input{display:none;}
  .preview{margin-top:10px; text-align:center;}
  .preview img{max-width:100%; max-height:160px; border-radius:8px; border:1px solid var(--borde);}
  .fotos-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .fotos-grid .miniatura{position:relative; width:76px; height:76px;}
  .fotos-grid .miniatura img{width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--borde);}
  .fotos-grid .miniatura .quitar{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:var(--alerta); color:#fff; border:2px solid #fff; font-size:12px; line-height:18px; text-align:center; cursor:pointer; padding:0;}

  .motivo-box{margin-top:10px; display:none;}
  .motivo-box.visible{display:block;}

  .motivo-box .confirmar{margin-top:8px; width:100%; padding:12px; background:var(--alerta); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer;}

  .card.hecha{opacity:.65; border-left-color:var(--gris);}
  .card .estado-final{font-size:14px; font-weight:700; padding:8px; text-align:center; border-radius:8px;}
  .estado-final.ok{background:#D1FAE5; color:#065F46;}
  .estado-final.no{background:#FEE2E2; color:#991B1B;}

  .vacio{text-align:center; color:var(--gris); font-style:italic; padding:40px 20px; background:#fff; border-radius:12px;}
  .toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); padding:13px 20px; border-radius:10px; font-size:14px; font-weight:600; z-index:100; display:none; box-shadow:0 4px 14px rgba(0,0,0,.15); max-width:90%;}
  .toast.exito{display:block; background:#065F46; color:#fff;}
  .toast.error{display:block; background:var(--alerta); color:#fff;}
  .toast.aviso{display:block; background:#92400E; color:#fff;}
  .gps-nota{font-size:11px; color:var(--gris); text-align:center; margin-top:6px;}
  footer{text-align:center; color:var(--gris); font-size:11px; padding:16px;}
</style>
</head>
<body>
<header>
  <h1>Mis Entregas</h1>
  <div class="marca">LIVES</div>
</header>

<div class="contenedor">
  <div class="selector">
    <label>Selecciona tu nombre</label>
    <select id="selChofer"><option value="">Cargando...</option></select>
    <button class="refrescar" id="btnRefrescar">Actualizar mi ruta</button>
  </div>

  <div class="jornada" id="jornada">
    <div class="titulo">🚀 Empezar jornada — ¿de qué planta saliste?</div>
    <div id="jornadaCuerpo"></div>
  </div>

  <div class="resumen" id="resumen"></div>
  <div id="lista"></div>
</div>

<div class="toast" id="toast"></div>
<footer>LIVES · Sistema de Movilidades · Uso interno</footer>

<div class="modal-confirma-jornada" id="modalConfirmaJornada">
  <div class="caja">
    <div class="icono" id="iconoConfirmaJornada">✅</div>
    <div class="titulo" id="tituloConfirmaJornada">¡Listo!</div>
    <div class="detalle" id="detalleConfirmaJornada"></div>
    <button type="button" class="btn-entendido" id="btnEntendidoJornada">Entendido</button>
  </div>
</div>

<script>
// =============== CONFIGURACIÓN ===============
// chofer_entregas_v2 · 24/09/2026 · Lee y guarda en Supabase (lives-datos), ya no en el Apps Script.
// Funciona SIN sesión del portal (excepción acordada): el chofer elige su nombre de la lista.
// Solo puede usar las funciones públicas de Movilidades (su ruta, llegada, entrega, base, fotos).
var SB_URL = 'https://xxfufpddgoyhbotjmaiy.supabase.co';
var SB_KEY = 'sb_publishable_1g-n6UT70EUlNAo8Lyc04w_jKR4LpXZ';   // clave pública
// =============================================

// ---------- Supabase: una llamada con tiempo límite y UN reintento si falla la red ----------
function rpc(fn, args){
  function intento(){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, 15000);
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST', cache:'no-store', signal: ctl ? ctl.signal : undefined,
      headers:{ 'apikey':SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(args || {})
    }).then(function(r){
      clearTimeout(reloj);
      return r.text().then(function(t){
        var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
        if (!r.ok){ var err = new Error((j && j.message) || ('Error ' + r.status)); err.status = r.status; throw err; }
        return j;
      });
    }, function(e){ clearTimeout(reloj); var err = new Error('Sin conexión. Revisa la señal y vuelve a intentar.'); err.red = true; throw err; });
  }
  return intento().catch(function(e){
    if (!e.red && e.status && e.status < 500) throw e;         // error de validación: no se reintenta
    return new Promise(function(ok){ setTimeout(ok, 1500); }).then(intento);
  });
}

var choferActual = '';
var solicitudes = [];
var fotos = {}; // id -> [dataURL, dataURL, ...]

function valC(c){ return c ? (c.f!=null?c.f:(c.v!=null?c.v:'')) : ''; }

// ---------- Cargar choferes (Apps Script: inmune a filtros visuales del Sheet) ----------
function cargarChoferes(){
  rpc('mov_choferes_app', {}).then(function(lista){
    procesarChoferes({ filas: (lista || []).map(function(c){ return [c.nombre, '', '', 'SI']; }) });
  }).catch(function(e){
    document.getElementById('selChofer').innerHTML = '<option value="">No se pudo cargar la lista</option>';
    mostrarToast(e.message, 'error');
    setTimeout(cargarChoferes, 5000);                       // vuelve a intentar solo
  });
}
function procesarChoferes(json){
  var sel = document.getElementById('selChofer');
  sel.innerHTML = '<option value="">— Selecciona tu nombre —</option>';
  try{
    var filas = (json && json.filas) ? json.filas : [];
    filas.forEach(function(row){
      var nombre = String(row[0]||'').trim();
      var activo = String(row[3]||'SI').trim().toUpperCase();
      if(nombre && activo!=='NO'){
        var op=document.createElement('option'); op.value=nombre; op.textContent=nombre; sel.appendChild(op);
      }
    });
  }catch(e){}
  // Recordar último chofer en este dispositivo
  try{
    var g = localStorage.getItem('lives_chofer');
    if(g){ sel.value=g; if(sel.value){ choferActual=g; cargarRuta(); cargarEstadoJornada(); } }
  }catch(e){}
}
window.procesarChoferes = procesarChoferes;

document.getElementById('selChofer').addEventListener('change', function(){
  choferActual = this.value;
  try{ localStorage.setItem('lives_chofer', choferActual); }catch(e){}
  if(choferActual){ cargarRuta(); cargarEstadoJornada(); }
  else { document.getElementById('lista').innerHTML=''; document.getElementById('resumen').innerHTML=''; document.getElementById('jornada').className='jornada'; }
});
document.getElementById('btnRefrescar').addEventListener('click', function(){
  if(choferActual) cargarRuta(); else mostrarToast('Selecciona tu nombre primero','error');
});

// ---------- Jornada: salida/llegada de base (para el kilometraje) ----------
function cargarEstadoJornada(){
  rpc('mov_bitacora_hoy', { p_chofer: choferActual })
    .then(function(r){ window.procesarJornada(r); })
    .catch(function(e){ mostrarToast(e.message, 'error'); });
}
window.procesarJornada = function(r){
  if(!r || !r.ok) return;
  renderJornada(r.salida || null, r.llegada || null);
};

function renderJornada(salida, llegada){
  var cont = document.getElementById('jornada');
  var cuerpo = document.getElementById('jornadaCuerpo');
  var titulo = cont.querySelector('.titulo');
  cont.className = 'jornada visible';

  if(!salida){
    titulo.textContent = '🚀 Empezar jornada — ¿de dónde saliste?';
    cuerpo.innerHTML =
        '<div class="elegir">'
      + '<button type="button" onclick="marcarBase(\'salida\',\'BARRANCO\')">Salí de Barranco</button>'
      + '<button type="button" onclick="marcarBase(\'salida\',\'CHORRILLOS\')">Salí de Chorrillos</button>'
      + '</div>'
      + '<button type="button" class="btn-otro-punto" onclick="marcarBase(\'salida\',\'OTRO\')">📍 Otro punto (mi ubicación actual)</button>';
    return;
  }
  if(salida && !llegada){
    titulo.textContent = '🏁 Terminar jornada — ¿dónde terminaste?';
    cuerpo.innerHTML =
        '<div class="confirmado"><span class="icono">✓</span> Jornada iniciada desde '+nombreBaseCorto(salida.base)+'</div>'
      + '<div class="elegir" style="margin-top:10px">'
      + '<button type="button" onclick="marcarBase(\'llegada\',\'BARRANCO\')">Volví a Barranco</button>'
      + '<button type="button" onclick="marcarBase(\'llegada\',\'CHORRILLOS\')">Volví a Chorrillos</button>'
      + '</div>'
      + '<button type="button" class="btn-otro-punto" onclick="marcarBase(\'llegada\',\'OTRO\')">📍 Otro punto (mi ubicación actual)</button>'
      + '<button type="button" class="btn-deshacer" onclick="deshacerBase(\'salida\')">↩️ Me equivoqué, deshacer la salida</button>';
    return;
  }
  titulo.textContent = '✓ Jornada de hoy completa';
  cuerpo.innerHTML =
      '<div class="confirmado" style="margin-bottom:8px"><span class="icono">🚀</span> Salida: '+nombreBaseCorto(salida.base)+'</div>'
    + '<div class="confirmado"><span class="icono">🏁</span> Llegada: '+nombreBaseCorto(llegada.base||salida.base)+'</div>'
    + '<button type="button" class="btn-deshacer" onclick="deshacerBase(\'llegada\')">↩️ Me equivoqué, deshacer la llegada</button>';
}

function nombreBaseCorto(base){
  if (base === 'OTRO') return 'otro punto (tu ubicación)';
  return TEXTO_BASE[base] || base || '';
}

var TEXTO_BASE = { BARRANCO:'Barranco', CHORRILLOS:'Chorrillos', OTRO:'tu ubicación actual (no la planta)' };
function marcarBase(tipo, base){
  var verbo = tipo === 'salida' ? 'saliste de' : 'volviste a';
  if (!confirm('¿Seguro que '+verbo+' '+TEXTO_BASE[base]+'?')) return;
  var botones = document.querySelectorAll('#jornadaCuerpo button');
  botones.forEach(function(b){ b.disabled = true; });
  document.getElementById('jornadaCuerpo').innerHTML = '';
  window.__marcaEnCurso = { tipo:tipo, base:base };
  requerirGPS(document.getElementById('jornada'), function(u){
    rpc('mov_marcar_base', { p_chofer: choferActual, p_evento: tipo === 'salida' ? 'SALIDA_BASE' : 'LLEGADA_BASE',
                             p_base: base, p_lat: String(u.lat||''), p_lng: String(u.lng||'') })
      .then(function(r){ window.respMarcarBase(r); })
      .catch(function(e){ mostrarToast(e.message,'error'); cargarEstadoJornada(); });
  }, base !== 'OTRO');
}
window.respMarcarBase = function(r){
  var marca = window.__marcaEnCurso || {};
  if(r && r.ok){
    var accionTexto = marca.tipo === 'salida' ? 'Salida desde' : 'Llegada a';
    mostrarConfirmacionJornada(
      r.yaExistia ? 'Ya estaba registrado' : '¡Listo, quedó registrado!',
      accionTexto + ' ' + nombreBaseCorto(marca.base || r.base || '') + '.'
    );
  } else {
    mostrarToast((r&&r.msg)?r.msg:'Error al registrar','error');
  }
  // Pequeño margen antes de volver a preguntar el estado, para que el guardado quede asentado.
  setTimeout(cargarEstadoJornada, 400);
};

// ---------- Confirmación clara (no un toast que se pierde) para no dejar dudas de si se guardó ----------
function mostrarConfirmacionJornada(titulo, detalle){
  document.getElementById('tituloConfirmaJornada').textContent = titulo;
  document.getElementById('detalleConfirmaJornada').textContent = detalle;
  document.getElementById('modalConfirmaJornada').classList.add('visible');
}
document.getElementById('btnEntendidoJornada').addEventListener('click', function(){
  document.getElementById('modalConfirmaJornada').classList.remove('visible');
});

function deshacerBase(tipo){
  if (!confirm('¿Deshacer el registro de '+(tipo==='salida'?'salida':'llegada')+' de hoy?')) return;
  document.getElementById('jornadaCuerpo').innerHTML = '<div style="font-size:13px;color:var(--gris)">Deshaciendo...</div>';
  rpc('mov_deshacer_base', { p_chofer: choferActual, p_evento: tipo==='salida'?'SALIDA_BASE':'LLEGADA_BASE' })
    .then(function(r){ window.respDeshacerBase(r); })
    .catch(function(e){ mostrarToast(e.message,'error'); cargarEstadoJornada(); });
}
window.respDeshacerBase = function(r){
  if(r && r.ok){ mostrarToast('Deshecho','exito'); }
  else { mostrarToast((r&&r.msg)?r.msg:'No se pudo deshacer','error'); }
  setTimeout(cargarEstadoJornada, 400);
};

// ---------- Cargar ruta del chofer (Apps Script: inmune a filtros visuales del Sheet) ----------
function cargarRuta(){
  document.getElementById('lista').innerHTML='<div class="vacio">Cargando tu ruta...</div>';
  rpc('mov_ruta_chofer', { p_chofer: choferActual }).then(function(lista){
    // Misma forma de fila que usaba el Apps Script (columnas de la pestaña SOLICITUDES).
    var filas = (lista || []).map(function(s){
      var f = []; f[0]=s.id; f[2]=s.area_solicitante; f[3]=s.origen; f[4]=s.tipo; f[5]=s.cantidad_und;
      f[6]=s.peso_aprox_kg; f[7]=s.destino; f[8]=s.distrito; f[9]=s.zona; f[10]=s.prioridad;
      f[11]=s.comentarios; f[12]=choferActual; f[13]=s.fecha_programada||''; f[14]=s.estado;
      f[20]=s.tipo_servicio; f[23]=s.fecha_necesidad||'';
      return f;
    });
    procesarRuta({ filas: filas });
  }).catch(function(e){
    document.getElementById('lista').innerHTML='<div class="vacio">No hay conexión con la base de datos.<br>'
      + '<button class="btn-llegue" style="margin-top:12px" onclick="cargarRuta()">🔄 Reintentar</button></div>';
  });
}
function normalizar(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

function fechaHoyISO(){
  var hoy = new Date();
  return hoy.getFullYear()+'-'+('0'+(hoy.getMonth()+1)).slice(-2)+'-'+('0'+hoy.getDate()).slice(-2);
}
function esFechaHoy(v){
  if (!v) return false;
  var iso;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) iso = v;
  else {
    var m = String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);
    iso = m ? (m[3]+'-'+m[2]+'-'+m[1]) : '';
  }
  return iso === fechaHoyISO();
}

function procesarRuta(json){
  solicitudes = [];
  var pendientesOtroDia = 0;
  var chN = normalizar(choferActual);
  try{
    var todas = (json && json.filas) ? json.filas : [];
    todas.forEach(function(row){
      var chofer = normalizar(row[12]);
      var estado = String(row[14]||'').toUpperCase();
      var fechaprog = String(row[13]||'');
      if(chofer !== chN) return;
      if(estado !== 'PROGRAMADO' && estado !== 'EN_ESPERA') return; // solo lo activo del chofer
      // Solo se muestra lo programado para HOY. Lo de otros días queda oculto hasta su fecha.
      // Excepción: si ya está EN_ESPERA (el chofer ya llegó y quedó pendiente de cerrar),
      // siempre se muestra sin importar la fecha — ocultarlo dejaría una entrega a medias sin cómo cerrarla.
      if (estado !== 'EN_ESPERA' && !esFechaHoy(fechaprog)){
        pendientesOtroDia++;
        return;
      }
      solicitudes.push({
        id:String(row[0]||''), tipo:String(row[4]||''),
        cantidad:String(row[5]||''), peso:String(row[6]||''),
        destino:String(row[7]||''), distrito:String(row[8]||''),
        zona:String(row[9]||'').toUpperCase(), prioridad:String(row[10]||'').toUpperCase(),
        comentarios:String(row[11]||''), fechaprog:fechaprog, area:String(row[2]||''),
        origen:String(row[3]||''), servicio:String(row[20]||'ENVIO').toUpperCase(),
        fechanecesidad:String(row[23]||''),
        estado:estado,
        num:(function(){var m=String(row[0]||'').match(/MOV-(\d+)/);return m?parseInt(m[1],10):0;})()
      });
    });
  }catch(e){}
  window.__pendientesOtroDia = pendientesOtroDia;
  solicitudes.sort(function(a,b){
    var ea=a.estado==='EN_ESPERA'?0:1, eb=b.estado==='EN_ESPERA'?0:1;
    if(ea!==eb) return ea-eb;
    var ua=a.prioridad==='SI'?0:1, ub=b.prioridad==='SI'?0:1;
    if(ua!==ub) return ua-ub;
    if(a.zona!==b.zona) return a.zona<b.zona?-1:1;
    return a.num-b.num;
  });
  render();
}
window.procesarRuta = procesarRuta;

function render(){
  var lista = document.getElementById('lista');
  var otroDia = window.__pendientesOtroDia || 0;
  var notaOtroDia = otroDia ? ' · '+otroDia+' más programada'+(otroDia>1?'s':'')+' para otro día (aparecerán en su fecha)' : '';
  document.getElementById('resumen').innerHTML = '<b>'+solicitudes.length+'</b> entrega(s) para hoy'+notaOtroDia;
  if(!solicitudes.length){
    lista.innerHTML = '<div class="vacio">No tienes entregas programadas para hoy.'+(otroDia?'<br><br>Tienes '+otroDia+' programada'+(otroDia>1?'s':'')+' para otros días — aparecerán automáticamente en su fecha.':'')+'</div>';
    return;
  }
  var html='';
  solicitudes.forEach(function(o){
    var cantPeso = o.tipo.toUpperCase()==='CARGA' ? (o.peso? o.peso+' kg':'—') : (o.cantidad? o.cantidad+' und':'—');
    var esRecojo = o.servicio==='RECOJO';
    var esTraslado = o.servicio==='TRASLADO';
    var enEspera = o.estado==='EN_ESPERA';
    var badgeServ = esTraslado
        ? '<span class="badge-serv traslado">TRASLADO</span>'
        : esRecojo ? '<span class="badge-serv recojo">RECOJO</span>' : '<span class="badge-serv envio">ENVÍO</span>';
    var lineaAccion = esTraslado
        ? '<div class="accion-linea traslado">🔄 TRASLADO — dos puntos, sin pasar por LIVES:</div><div class="destino">'+o.origen+' → '+o.destino+'</div><div class="distrito">'+o.distrito+'</div>'
        : esRecojo
        ? '<div class="accion-linea recojo">📥 RECOGER EN:</div><div class="destino">'+o.destino+'</div><div class="distrito">'+o.distrito+' · luego llevar a <b>'+o.origen+'</b></div>'
        : '<div class="accion-linea envio">📤 ENTREGAR EN:</div><div class="destino">'+o.destino+'</div><div class="distrito">'+o.distrito+'</div>';
    var txtBtnOk = esTraslado ? '✓ Traslado hecho' : (esRecojo ? '✓ Recogido' : '✓ Entregado');
    var textoEspera = esTraslado ? 'cerrar el traslado' : (esRecojo ? 'recojo' : 'entrega');
    var bloqueEspera = enEspera ? '<div class="badge-espera">⏳ Ya llegaste · en espera de '+textoEspera+'</div>' : '';
    var accionesHtml = enEspera
        ? ('<div class="acciones">'
          +   '<button class="btn-entregado" onclick="marcarEntregado(\''+o.id+'\')">'+txtBtnOk+'</button>'
          +   '<button class="btn-noentregado" onclick="mostrarMotivo(\''+o.id+'\')">No se pudo</button>'
          + '</div>'
          + '<label class="btn-foto" id="lblfoto-'+o.id+'" for="foto-'+o.id+'">📷 Agregar foto (opcional)</label>'
          + '<input type="file" accept="image/*" capture="environment" class="foto-input" id="foto-'+o.id+'" onchange="capturarFoto(\''+o.id+'\', this)">'
          + '<div class="fotos-grid" id="prev-'+o.id+'"></div>'
          + '<div class="motivo-box" id="motivo-'+o.id+'">'
          +   '<textarea id="txtmotivo-'+o.id+'" placeholder="¿Por qué no se pudo? (obligatorio)"></textarea>'
          +   '<button class="confirmar" onclick="marcarNoEntregado(\''+o.id+'\')">Confirmar</button>'
          + '</div>')
        : ('<button class="btn-llegue" onclick="marcarLlegue(\''+o.id+'\')">📍 Llegué al punto</button>');
    html += '<div class="card '+(o.prioridad==='SI'?'urgente':'')+' '+(enEspera?'en-espera':'')+'" id="card-'+o.id+'">'
      + '<div class="top"><span class="id">'+o.id+'</span>'
      +   '<span>'+badgeServ+' '+(o.prioridad==='SI'?'<span class="badge-urg">URGENTE</span> ':'')+'<span class="badge-zona">'+o.zona+'</span></span></div>'
      + lineaAccion
      + '<div class="datos"><b>Tipo:</b> '+o.tipo+' · <b>'+cantPeso+'</b><br><b>Área:</b> '+o.area+(o.fechanecesidad?'<br><b>Se necesita para:</b> '+o.fechanecesidad:'')+'</div>'
      + (o.comentarios? '<div class="coment">📝 '+o.comentarios+'</div>':'')
      + bloqueEspera
      + accionesHtml
      + '</div>';
  });
  lista.innerHTML = html;
}

// ---------- Fotos (comprimir, permite varias) ----------
function capturarFoto(id, input){
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var max=900, w=img.width, h=img.height;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl = cv.toDataURL('image/jpeg', 0.55);
      if(!fotos[id]) fotos[id] = [];
      fotos[id].push(dataUrl);
      renderFotos(id);
      input.value = ''; // permite volver a elegir/tomar otra foto de inmediato
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function quitarFoto(id, idx){
  if(!fotos[id]) return;
  fotos[id].splice(idx, 1);
  renderFotos(id);
}

function renderFotos(id){
  var cont = document.getElementById('prev-'+id);
  var lbl = document.getElementById('lblfoto-'+id);
  var lista = fotos[id] || [];
  if(cont){
    cont.innerHTML = lista.map(function(dataUrl, idx){
      return '<div class="miniatura"><img src="'+dataUrl+'">'
        + '<button type="button" class="quitar" onclick="quitarFoto(\''+id+'\', '+idx+')" title="Quitar esta foto">✕</button></div>';
    }).join('');
  }
  if(lbl){
    if(lista.length){ lbl.classList.add('con-foto'); lbl.textContent='📷 Agregar otra foto ('+lista.length+' agregada'+(lista.length>1?'s':'')+')'; }
    else { lbl.classList.remove('con-foto'); lbl.textContent='📷 Agregar foto (opcional)'; }
  }
}

// ---------- Geolocalización (no bloqueante) ----------
function obtenerUbicacionUnaVez(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){ resolve({lat:'',lng:'',error:'NOSOPORTADO'}); return; }
    var listo=false;
    var t=setTimeout(function(){ if(!listo){ listo=true; resolve({lat:'',lng:'',error:'SENAL'}); } }, 7000);
    navigator.geolocation.getCurrentPosition(
      function(pos){ if(!listo){ listo=true; clearTimeout(t); resolve({lat:pos.coords.latitude.toFixed(6), lng:pos.coords.longitude.toFixed(6), error:null}); } },
      function(err){ if(!listo){ listo=true; clearTimeout(t); resolve({lat:'',lng:'', error: (err && err.code===1) ? 'PERMISO' : 'SENAL'}); } },
      { enableHighAccuracy:true, timeout:6000, maximumAge:0 }
    );
  });
}
// Reintenta solas las fallas de señal (tiene sentido esperar un poco más); si es permiso
// denegado, reintentar automaticamente no sirve de nada — el navegador no vuelve a preguntar.
function obtenerUbicacionConReintentos(intentos){
  intentos = intentos || 3;
  return obtenerUbicacionUnaVez().then(function(u){
    if (u.lat && u.lng) return u;
    if (u.error === 'PERMISO' || intentos <= 1) return u;
    return obtenerUbicacionConReintentos(intentos - 1);
  });
}

// ---------- Exige GPS antes de continuar: espera, reintenta, y si no se puede,
// explica claramente al chofer qué hacer (con una salida manual como último recurso) ----------
function requerirGPS(card, callback, permitirContinuarSinGPS){
  if (permitirContinuarSinGPS === undefined) permitirContinuarSinGPS = true;
  var zona = card.querySelector('.zona-gps');
  if (!zona){ zona = document.createElement('div'); zona.className='zona-gps'; card.appendChild(zona); }

  function mostrarEsperando(){
    zona.innerHTML = '<div class="gps-esperando"><span class="spinner"></span> Buscando tu ubicación...</div>';
  }
  function intentar(){
    mostrarEsperando();
    obtenerUbicacionConReintentos(3).then(function(u){
      if (u.lat && u.lng){ zona.innerHTML=''; callback(u); return; }
      var esPermiso = u.error === 'PERMISO';
      var msg = esPermiso
        ? 'Necesitamos tu ubicación para este sistema. Actívala: toca el candado 🔒 junto a la dirección del navegador → Permisos del sitio → Ubicación → Permitir. Luego presiona Reintentar.'
        : 'No se pudo conseguir tu ubicación (señal débil). Si puedes, sal a un lugar más abierto y presiona Reintentar.';
      if (!permitirContinuarSinGPS) msg += ' Este punto necesita tu ubicación — no se puede continuar sin ella.';
      zona.innerHTML =
          '<div class="gps-bloqueo">'
        + '<div class="gps-msg">📍 '+msg+'</div>'
        + '<div class="gps-botones">'
        + '<button type="button" class="btn-gps-reintentar">🔄 Reintentar</button>'
        + (permitirContinuarSinGPS ? '<button type="button" class="btn-gps-continuar">Continuar sin ubicación (no sumará al kilometraje)</button>' : '')
        + '</div></div>';
      zona.querySelector('.btn-gps-reintentar').addEventListener('click', intentar);
      var btnContinuar = zona.querySelector('.btn-gps-continuar');
      if (btnContinuar) btnContinuar.addEventListener('click', function(){ zona.innerHTML=''; callback({lat:'',lng:''}); });
    });
  }
  intentar();
}

// ---------- Marcar llegada al punto ----------
function marcarLlegue(id){
  var card = document.getElementById('card-'+id);
  var btn = card.querySelector('.btn-llegue');
  btn.disabled = true; btn.textContent = 'Esperando ubicación...';
  requerirGPS(card, function(u){
    window.__idEnCurso = id;
    rpc('mov_llegue', { p_id:id, p_chofer:choferActual, p_lat:String(u.lat||''), p_lng:String(u.lng||'') })
      .then(function(r){ window.respLlegue(r); })
      .catch(function(e){ mostrarToast(e.message,'error'); btn.disabled=false; btn.textContent='📍 Llegué al punto'; });
  });
}
window.respLlegue = function(r){
  var id = window.__idEnCurso;
  if(r && r.ok){
    mostrarToast('Llegada registrada','exito');
    var o = solicitudes.find(function(x){return x.id===id;});
    if(o) o.estado='EN_ESPERA';
    render();
  } else {
    mostrarToast((r&&r.msg)?r.msg:'Error al registrar llegada','error');
    // El estado que veías pudo quedar desactualizado (caché) — refresca la ruta real
    setTimeout(cargarRuta, 600);
  }
};

// ---------- Marcar entregado ----------
function marcarEntregado(id){
  var card = document.getElementById('card-'+id);
  var btns = card.querySelectorAll('button');
  btns.forEach(function(b){ b.disabled=true; });
  card.querySelector('.btn-entregado').textContent='Esperando ubicación...';
  requerirGPS(card, function(u){
    enviarEstado(id, 'ENTREGADO', '', u);
  });
}
function mostrarMotivo(id){
  document.getElementById('motivo-'+id).classList.add('visible');
}
function marcarNoEntregado(id){
  var motivo = document.getElementById('txtmotivo-'+id).value.trim();
  if(!motivo){ mostrarToast('Escribe el motivo','error'); return; }
  var card = document.getElementById('card-'+id);
  card.querySelectorAll('button').forEach(function(b){ b.disabled=true; });
  requerirGPS(card, function(u){
    enviarEstado(id, 'NO ENTREGADO', motivo, u);
  });
}

function enviarEstado(id, estado, motivo, u){
  window.__idEnCurso = id;
  rpc('mov_entregar', { p_id:id, p_chofer:choferActual, p_estado:estado, p_motivo:motivo||'',
                        p_lat:String(u.lat||''), p_lng:String(u.lng||'') })
    .then(function(r){ window.respEstado(r); })
    .catch(function(e){ mostrarToast(e.message,'error'); reactivar(id); });
}

window.respEstado = function(r){
  var id = window.__idEnCurso;
  if(r && r.ok){
    // Enviar fotos si existen (best-effort, por separado)
    if(fotos[id] && fotos[id].length) enviarFotos(id, fotos[id]);
    mostrarToast('Registrado: '+(r.msg||'ok'),'exito');
    // Quitar la card de la lista
    solicitudes = solicitudes.filter(function(x){ return x.id!==id; });
    render();
  } else {
    mostrarToast((r&&r.msg)?r.msg:'Error al registrar','error');
    reactivar(id);
    // El estado que veías pudo quedar desactualizado (caché) — refresca la ruta real
    setTimeout(cargarRuta, 600);
  }
};

function reactivar(id){
  var card = document.getElementById('card-'+id);
  if(!card) return;
  card.querySelectorAll('button').forEach(function(b){ b.disabled=false; });
  var be=card.querySelector('.btn-entregado'); if(be) be.textContent='✓ Entregado';
}

// Fotos: se suben al almacén "movilidades" de Supabase y luego se anotan en la solicitud.
// No bloquean al chofer: la entrega ya quedó registrada. Si alguna no sube, se reintenta una
// vez y, si igual falla, se avisa (antes se perdían en silencio).
function nombreAlAzar(){
  var b = new Uint8Array(12);
  (window.crypto || window.msCrypto).getRandomValues(b);
  return Date.now().toString(36) + '_' + Array.prototype.map.call(b, function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
}
function dataUrlABlob(dataUrl){
  var partes = dataUrl.split(','), bin = atob(partes[1]), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:'image/jpeg' });
}
function subirUnaFoto(id, dataUrl){
  var ruta = 'fotos/' + id + '/' + nombreAlAzar() + '.jpg';
  function intento(){
    return fetch(SB_URL + '/storage/v1/object/movilidades/' + ruta, {
      method:'POST', headers:{ 'apikey':SB_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'false' },
      body: dataUrlABlob(dataUrl)
    }).then(function(r){ if (!r.ok) throw new Error('foto ' + r.status); return ruta; });
  }
  return intento().catch(function(){ return new Promise(function(ok){ setTimeout(ok, 2000); }).then(intento); });
}
function enviarFotos(id, listaDataUrls){
  var lista = listaDataUrls.slice();
  delete fotos[id];
  Promise.all(lista.map(function(d){ return subirUnaFoto(id, d).catch(function(){ return null; }); }))
    .then(function(rutas){
      var ok = rutas.filter(Boolean);
      var fallidas = rutas.length - ok.length;
      var fin = function(){
        if (fallidas) mostrarToast(fallidas + ' foto(s) de ' + id + ' no se pudieron subir (sin señal). La entrega sí quedó registrada.', 'aviso');
      };
      if (!ok.length) { fin(); return; }
      return rpc('mov_registrar_fotos', { p_id:id, p_rutas:ok, p_chofer:choferActual }).then(fin, function(){
        mostrarToast('Las fotos de ' + id + ' subieron, pero no se pudieron anotar. Avisa a Logística.', 'aviso');
      });
    });
}

function mostrarToast(msg, tipo){
  var t=document.getElementById('toast'); t.textContent=msg; t.className='toast '+tipo;
  setTimeout(function(){ t.className='toast'; }, tipo==='aviso' ? 6000 : 4000);
}

// Init
cargarChoferes();
</script>

     pase 20 s sin teclear) y, antes de recargar, pide a la herramienta que guarde su borrador si tiene uno.
     Solo pide el encabezado del archivo (HEAD), no lo descarga. ===== -->
<style id="lsActCss">
#lsAct{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;
  background:rgba(14,59,54,.78);padding:16px;font-family:Calibri,Arial,sans-serif}
#lsAct .lsActCaja{background:#fff;border-radius:12px;border-top:4px solid #10B981;box-shadow:0 10px 30px rgba(0,0,0,.25);
  max-width:440px;width:100%;padding:26px 24px 22px;text-align:center;color:#1a1a1a}

  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}

<script id="lsActJs">(function(){
  'use strict';
  if (window.__lsAct) return; window.__lsAct = true;
  if (!/^https?:$/.test(location.protocol)) return;
  var url = location.origin + location.pathname, base = null, pendiente = false, ultimaTecla = 0;
  /* Mientras la persona escribe no se interrumpe: se espera a que pasen 20 s sin teclear. */
  ['input','keydown','change'].forEach(function(ev){
    document.addEventListener(ev, function(e){ if (!e.target || !e.target.closest || !e.target.closest('#lsAct')) ultimaTecla = Date.now(); }, true);
  });
  function firma(){
    return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function(r){
      if (!r.ok) return null;
      return r.headers.get('etag') || r.headers.get('last-modified') || null;
    }, function(){ return null; });
  }
  function recargar(){
    /* Si la herramienta guarda borrador (p. ej. el formulario de auditoría), se guarda antes de recargar. */
    if (ultimaTecla){
      ['guardarBorradorAhora','guardarBorradorPeriodico','guardarBorrador'].some(function(n){
        try { if (typeof window[n] === 'function'){ window[n](); return true; } } catch(e){}
        return false;
      });
    }
    setTimeout(function(){ location.reload(); }, 150);
  }
  function aviso(){
    if (document.getElementById('lsAct') && document.getElementById('lsAct').style.display === 'flex') return;
    if (Date.now() - ultimaTecla < 20000){ setTimeout(aviso, 5000); return; }
    var d = document.getElementById('lsAct');
    if (!d){
      d = document.createElement('div'); d.id = 'lsAct';
      d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'lsActT');
      d.innerHTML = '<div class="lsActCaja"><div class="lsActIco" aria-hidden="true">&#8635;</div>' +
        '<h2 id="lsActT">Hay una versión nueva</h2>' +
        '<p>Esta herramienta se actualizó. Toca <b>Actualizar</b> para seguir trabajando con la versión nueva.</p>' +
        '<button id="lsActSi" type="button">Actualizar</button></div>';
      (document.body || document.documentElement).appendChild(d);
      document.getElementById('lsActSi').onclick = recargar;
    }
    d.style.display = 'flex';
    document.documentElement.style.overflow = 'hidden';
    var b = document.getElementById('lsActSi'); if (b) b.focus();
  }
  /* No se puede cerrar: Escape no hace nada, el foco no sale del aviso y si algo lo quita vuelve a salir. */
  document.addEventListener('keydown', function(e){
    var d = document.getElementById('lsAct'); if (!d || d.style.display !== 'flex') return;
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); }
    if (e.key === 'Tab'){ e.preventDefault(); var b = document.getElementById('lsActSi'); if (b) b.focus(); }
  }, true);
  setInterval(function(){
    if (!pendiente) return;
    var d = document.getElementById('lsAct');
    if (!d || d.style.display !== 'flex') aviso();
  }, 1500);
  function revisar(){
    if (document.hidden || pendiente) return;
    firma().then(function(f){
      if (!f) return;
      if (base === null){ base = f; return; }
      if (f !== base){ pendiente = true; aviso(); }
    });
  }
  revisar();
  setInterval(revisar, 3 * 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) revisar(); });
})();</script>
